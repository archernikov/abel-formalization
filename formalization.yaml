    type: "paper"
    location: "Selecta Mathematica 5 (1999), 397-421"
    relationship: "background"
    note: >-
      Background for the theorem-of-the-complement and weak-family arguments.
      The required steps are proved in Lean rather than imported as axioms.
  - title: "Finitude simple et structures o-minimales (Finiteness Property Implies o-Minimality)"
    authors:
      - "Jean-Marie Lion"
    id: "https://www.jstor.org/stable/3648591"
    type: "paper"
    location: "The Journal of Symbolic Logic 67 (2002), no. 4, 1616-1622"
    relationship: "background"
