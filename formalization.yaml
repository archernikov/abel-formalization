    relationship: "formalizes"
    note: >-
      Artem Chernikov's private working manuscript omin.tex, Version 29,
      7 September 2026, is the substantive mathematical source formalized by
      this project. The author states that the manuscript contains his new
      original proof of the theorem, obtained using GPT6 Astra. It supplied
