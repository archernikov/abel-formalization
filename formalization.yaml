fidelity:
  divergences: >-
    The private manuscript is the source of the conditional main theorem and
    its proof architecture; its four Abel hypotheses are represented without a
    known statement mismatch. As an additional development, the Lean project
    supplies a construction of a suitable Abel function and combines it with
    the conditional theorem to obtain exists_abel_ominimal_expansion. The
    existence claim itself is discussed in the manuscript. The invariant-density
    construction developed for this formalization normalizes a positive analytic
    invariant density by its positive primitive
    increment, rather than proving the precise Szekeres density asymptotic; it
    therefore makes no uniqueness or distinguished-solution claim. Total values
    of A outside (0,infinity) are arbitrary and play no role.

review:
  status: "agent-reviewed"
  reviewers:
    - "Codex gpt-6-astra agents"
    - "Codex gpt-5.6-sol agents"
  notes: >-
    Agent-led statement-correspondence, dependency, reuse, compilation, and
    axiom audits are recorded in the repository. No completed independent
    human-expert review has been reported. This section records the project's
    own audits and does not assert Palomar registration.

alignment:
  namespace: "AbelFormalization"
  statements:
    - source: "Private manuscript Version 29, conditional main theorem, lines 131-141"
      lean: "AbelFormalization.mainTheorem"
      module: "AbelFormalization.WilkieSection4LiteralZeroInduction"
      status: "proved"
      note: >-
        Proves the o-minimality, full-exponential definability,
        positive-input inverse definability, and fixed-iterate growth clauses
        from exactly the four IsAbel hypotheses.
    - source: "Private manuscript Version 29, existence discussion, lines 72-107"
      lean: "AbelFormalization.exists_abel_ominimal_expansion"
      module: "AbelFormalization.AbelExistentialMainTheorem"
      status: "proved"
      note: >-
        Develops an invariant-density construction within the Lean project to
        prove the existence discussed in the manuscript, then applies the
        universal theorem. This additional construction and its unconditional
        Lean corollary are distinguished from the manuscript's conditional
        theorem and proof architecture. The construction does not establish
        the stronger Szekeres asymptotic or a uniqueness claim.

