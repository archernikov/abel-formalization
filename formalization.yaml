version: "v0.4"

project:
  name: "A transexponential o-minimal structure"
  description: 'The real field expanded by the function $x\mapsto A(1+x^2)$, where $A$ is a normalized analytic Abel function for $e^x-1$, is an o-minimal structure that defines a function that grows faster than any finite iterate of the exponential function.'
  authors:
    - "Artem Chernikov"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Artem Chernikov"

classification:
  arxiv: ["math.LO"]
  msc2020: ["03C64"]

