      Background for existence and normalization of Abel functions. The Lean
      proof instead constructs a positive analytic invariant density from a
      normally convergent logarithmic-defect series, integrates it, and
      normalizes its positive increment. It does not identify the density with
      Szekeres's distinguished solution or prove his precise asymptotic.

related_formalizations:
  - id: "https://github.com/rwbarton/lean-omin/tree/fd733c6d95ef6f4743aae97de5e15df79877c00e"
    relationship: "independent"
    note: >-
      Reid Barton's Lean 3 o-minimality infrastructure was audited for reuse.
      No code from it is imported or ported here; it neither formalizes this
      Abel-function result nor supplies the complement theorem needed for it.

status:
  scope: >-
    The project proves both the universal conditional theorem
    AbelFormalization.mainTheorem and the unconditional existence theorem
    AbelFormalization.exists_abel_ominimal_expansion. For every total real
    function A whose restriction to (0,infinity) is analytic with positive
    derivative, is normalized by A(1)=0, and satisfies
    A(exp(x)-1)=A(x)+1 for x>0, the expansion of the real ordered field by
    C0(x)=A(1+x^2) is o-minimal. Definability is first-order definability with
    arbitrary real parameters. The full real exponential graph and the graph
    of the inverse of A restricted to positive inputs are definable. For every
    fixed natural k, that inverse eventually strictly dominates the k-fold
    iterate of the exponential. Lean represents A as a total function, but its
    values outside the positive half-line are irrelevant and unconstrained.
    The project also constructs an A satisfying the hypotheses. It does not
    prove uniqueness, identification with a distinguished Szekeres solution,
    or Szekeres's precise density asymptotic. The sorry counts cover the built
    substantive development and exclude both the two deliberate statement
    placeholders in Challenge.lean and the unbuilt historical Scratch/ archive.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

